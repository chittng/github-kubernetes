<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lời chúc</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, "Segoe UI", sans-serif;
      background: #fdf2f8;
    }
    .box {
      background: white;
      padding: 40px;
      border-radius: 16px;
      text-align: center;
      max-width: 420px;
      width: 90%;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }
    h1 { color: #db2777; margin-top: 0; }
    #message { font-size: 1.3rem; min-height: 3em; color: #333; }
    button {
      font-size: 1rem;
      padding: 10px 24px;
      border: none;
      border-radius: 8px;
      background: #db2777;
      color: white;
      cursor: pointer;
    }
    #version { margin-top: 24px; color: #999; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Lời chúc hôm nay</h1>
    <p id="message">Bấm nút để nhận lời chúc</p>
    <button onclick="getMessage()">Nhận lời chúc</button>
    <p id="version"></p>
  </div>

  <script>
    async function getMessage() {
      const response = await fetch('/api/message');
      const data = await response.json();
      document.getElementById('message').textContent = data.message;
      document.getElementById('version').textContent = 'Phiên bản: ' + data.version;
    }
  </script>
</body>
</html>
